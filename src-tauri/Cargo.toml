[package]
name = "mo-fish-reader"
version = "1.0.0"
description = "A terminal-disguised local TXT reader for quiet reading at work"
authors = ["local"]
edition = "2021"

[lib]
name = "fish_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
